<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="100%" height="100%" fill="#0a0a0d"/>
  <defs>
    <radialGradient id="aerisglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e02e1b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0a0a0d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#aerisglow)" />

  <!-- Audio Waveform / Lissajous Visualizer -->
  <g stroke="#e02e1b" fill="none" opacity="0.85">
    <!-- Circular Oscilloscope -->
    <circle cx="600" cy="400" r="220" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="600" cy="400" r="160" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="600" cy="400" r="100" stroke="#e02e1b" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- Dynamic Wave Paths -->
    <path d="M 150 400 Q 250 220 350 400 T 550 400 T 750 400 T 950 400 T 1050 400" stroke="#f5f5f3" stroke-width="2"/>
    <path d="M 150 400 Q 280 560 410 400 T 670 400 T 930 400 T 1050 400" stroke="#e02e1b" stroke-width="1.5" opacity="0.7"/>
    <path d="M 250 400 Q 400 150 600 400 T 950 400" stroke="#ff5e4d" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- Frequency Grid -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="150" y1="200" x2="1050" y2="200"/>
    <line x1="150" y1="300" x2="1050" y2="300"/>
    <line x1="150" y1="500" x2="1050" y2="500"/>
    <line x1="150" y1="600" x2="1050" y2="600"/>
  </g>

  <g font-family="monospace" font-size="12" fill="#8e8e93" letter-spacing="2">
    <text x="60" y="80">[ DSP HARMONIC ENGINE · 96kHz / 32-BIT FLOAT ]</text>
    <text x="60" y="105" fill="#e02e1b">FFT BUFFER: 4096 SAMPLES · LATENCY: 12ms</text>
    <text x="60" y="740">SYNTHESIS: POLYPHONIC WAVETABLE · HARMONICS: 16</text>
    <text x="940" y="740">SPECTRUM: 20Hz - 48kHz</text>
  </g>
</svg>
