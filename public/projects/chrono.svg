<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="100%" height="100%" fill="#08080a"/>
  <defs>
    <radialGradient id="chronoglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#08080a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#chronoglow)" />

  <!-- Horology Movement / Exploded Gear Calibre -->
  <g stroke="#d4af37" fill="none" opacity="0.85">
    <!-- Main Outer Bezel Ring -->
    <circle cx="600" cy="400" r="260" stroke="#f5f5f3" stroke-width="1.5"/>
    <circle cx="600" cy="400" r="248" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
    
    <!-- Balance Wheel & Spokes -->
    <circle cx="600" cy="400" r="180" stroke="#d4af37" stroke-width="2"/>
    <line x1="600" y1="220" x2="600" y2="580" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="420" y1="400" x2="780" y2="400" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="472" y1="272" x2="728" y2="528" stroke="#d4af37" stroke-width="1"/>
    <line x1="728" y1="272" x2="472" y2="528" stroke="#d4af37" stroke-width="1"/>

    <!-- Tourbillon Cage -->
    <circle cx="600" cy="400" r="90" stroke="#f5f5f3" stroke-width="2" stroke-dasharray="8 4"/>
    <circle cx="600" cy="400" r="40" fill="rgba(212,175,55,0.2)" stroke="#d4af37" stroke-width="2"/>
    <circle cx="600" cy="400" r="8" fill="#ff3b26"/>
    
    <!-- Fine Hour Markers -->
    <circle cx="600" cy="160" r="3" fill="#f5f5f3"/>
    <circle cx="840" cy="400" r="3" fill="#f5f5f3"/>
    <circle cx="600" cy="640" r="3" fill="#f5f5f3"/>
    <circle cx="360" cy="400" r="3" fill="#f5f5f3"/>
  </g>

  <g font-family="monospace" font-size="12" fill="#8e8e93" letter-spacing="2">
    <text x="60" y="80">[ CHRONO MONO · CALIBRE 312 EXPLODED VIEW ]</text>
    <text x="60" y="105" fill="#d4af37">FREQUENCY: 28,800 VPH (4Hz) · JEWELS: 39</text>
    <text x="60" y="740">SCRUBBED GSAP TIMELINE · LENIS LINKED</text>
    <text x="960" y="740">TOLERANCE: ±0.5 SEC/DAY</text>
  </g>
</svg>
