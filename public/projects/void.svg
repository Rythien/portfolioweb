<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="100%" height="100%" fill="#050608"/>
  <defs>
    <radialGradient id="voidglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#voidglow)" />

  <!-- Cryptographic Node Mesh & Wireframe Matrix -->
  <g stroke="#00e5ff" fill="none" opacity="0.8">
    <!-- Concentric Topology Rings -->
    <circle cx="600" cy="400" r="280" stroke="rgba(0,229,255,0.15)" stroke-width="1"/>
    <circle cx="600" cy="400" r="200" stroke="rgba(0,229,255,0.25)" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="600" cy="400" r="120" stroke="rgba(0,229,255,0.4)" stroke-width="1.5"/>

    <!-- Geometric Polygon Lattice -->
    <polygon points="600,200 773,300 773,500 600,600 427,500 427,300" stroke="#f5f5f3" stroke-width="1.5"/>
    <line x1="600" y1="200" x2="600" y2="600" stroke="#00e5ff" stroke-width="1"/>
    <line x1="427" y1="300" x2="773" y2="500" stroke="#00e5ff" stroke-width="1"/>
    <line x1="427" y1="500" x2="773" y2="300" stroke="#00e5ff" stroke-width="1"/>

    <!-- Key Node Vertices -->
    <circle cx="600" cy="200" r="5" fill="#00e5ff"/>
    <circle cx="773" cy="300" r="5" fill="#00e5ff"/>
    <circle cx="773" cy="500" r="5" fill="#00e5ff"/>
    <circle cx="600" cy="600" r="5" fill="#00e5ff"/>
    <circle cx="427" cy="500" r="5" fill="#00e5ff"/>
    <circle cx="427" cy="300" r="5" fill="#00e5ff"/>
    <circle cx="600" cy="400" r="8" fill="#ff3b26"/>
  </g>

  <g font-family="monospace" font-size="12" fill="#8e8e93" letter-spacing="2">
    <text x="60" y="80">[ VOID PROTOCOL · ZERO-KNOWLEDGE PROOF TOPOLOGY ]</text>
    <text x="60" y="105" fill="#00e5ff">CIRCUITS: 65,536 CONSTRAINTS · PROVER TIME: 42ms</text>
    <text x="60" y="740">CONSENSUS: BLAKE3 MERKLE TREE · VERIFIED ON-CHAIN</text>
    <text x="960" y="740">ENTROPY: 256-BIT SECURE</text>
  </g>
</svg>
